<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Extractor JSON · Texto griego visible</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-4">
    <h1 class="h4 mb-3">Extractor JSON · contenido visible</h1>
    <p class="text-muted">Este documento muestra solamente el contenido actualmente visible del lector.</p>
    <div class="d-flex gap-2 mb-3">
      <button id="btnDownload" class="btn btn-primary btn-sm" type="button">Descargar JSON</button>
      <button id="btnCopy" class="btn btn-outline-secondary btn-sm" type="button">Copiar JSON</button>
    </div>
    <pre id="jsonOutput" class="bg-white border rounded p-3 small" style="max-height:70vh;overflow:auto;">Cargando…</pre>
  </main>
  <script>
    const out = document.getElementById('jsonOutput');
    const btnDownload = document.getElementById('btnDownload');
    const btnCopy = document.getElementById('btnCopy');

    function safeParse(raw){
      try { return JSON.parse(raw); } catch { return null; }
    }

    const payload = safeParse(sessionStorage.getItem('aboutExtractorPayload') || '');
    if(!payload){
      out.textContent = 'No hay datos de extracción disponibles. Regresa al lector y vuelve a ejecutar "Acerca de".';
      btnDownload.disabled = true;
      btnCopy.disabled = true;
    } else {
      const pretty = JSON.stringify(payload, null, 2);
      out.textContent = pretty;
      const fileName = `extractor-${payload?.libros?.[0]?.slug || 'pasaje'}-${Date.now()}.json`;

      btnDownload.addEventListener('click', () => {
        const blob = new Blob([pretty], { type: 'application/json;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      });

      btnCopy.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(pretty);
          btnCopy.textContent = 'Copiado';
          setTimeout(() => { btnCopy.textContent = 'Copiar JSON'; }, 1200);
        } catch {
          btnCopy.textContent = 'No se pudo copiar';
        }
      });
    }
  </script>
</body>
</html>
